<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent trace</title>
<!--
  One recommendation's reasoning, in full.

  Opened as trace.html?i=<index>, where index is the row's position in the
  UNFILTERED snapshot -- app.py puts that on every row, so a link built from
  a filtered dashboard still resolves. Reads /recommendations/<i> from the
  same origin; makes no API calls of its own and runs no agents.

  Palette and shared components come from theme.css, the same file the
  dashboard links. Only this page's layout is below.

  This page is meant to be shown to an instructor, so each step reads as a
  sentence: what the agent asked, what it got back. The raw tool name and
  arguments are present but subordinate.
-->
<link rel="stylesheet" href="theme.css">
<style>
  .wrap { max-width: 860px; }

  .back {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 0.8125rem; text-decoration: none; margin-bottom: 22px;
  }
  .back:hover { text-decoration: underline; }

  .title { font-size: 1.375rem; font-weight: 640; margin: 0 0 12px;
           letter-spacing: -0.015em; line-height: 1.3; }
  .heading { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 12px; }
  .heading .grow { flex: 1; min-width: 0; }

  .facts { display: flex; flex-wrap: wrap; align-items: center;
           gap: 8px 14px; font-size: 0.8125rem;
           color: var(--text-secondary); margin-bottom: 20px; }

  /* The trace proper: a single rail down the page, one node per step, so the
     order the agent worked in is the order you read. */
  .phase { margin-bottom: 8px; }
  .phase-head {
    display: flex; align-items: baseline; gap: 10px;
    padding: 18px 0 14px; border-top: 1px solid var(--gridline);
  }
  .phase-head h2 {
    font-size: 0.75rem; font-weight: 640; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-muted); margin: 0;
  }
  .phase-head .q { font-size: 0.8125rem; color: var(--text-secondary); }
  .phase-head .n { margin-left: auto; font-size: 0.75rem; color: var(--text-muted);
                   font-variant-numeric: tabular-nums; }

  .rail { position: relative; padding-left: 26px; }
  .rail::before {
    content: ""; position: absolute; left: 7px; top: 6px; bottom: 10px;
    width: 1px; background: var(--gridline);
  }
  .node { position: relative; margin-bottom: 18px; }
  .node::before {
    content: ""; position: absolute; left: -23px; top: 6px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    /* 2px surface ring so the node stays legible where it crosses the rail */
    box-shadow: 0 0 0 2px var(--surface-1);
  }
  .node.bad::before { background: var(--critical); }
  .ask { color: var(--text-primary); margin-bottom: 4px; }
  .ask code {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 5px; font-size: 0.85em;
  }
  .got { color: var(--text-secondary); font-size: 0.8125rem; }
  .got .marker { color: var(--text-muted); }
  .args {
    color: var(--text-muted); font-size: 0.75rem; margin-top: 3px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    word-break: break-word;
  }

  .verdict {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px; margin-top: 4px;
  }
  .verdict h2 {
    font-size: 0.75rem; font-weight: 640; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-muted); margin: 0 0 10px;
  }
  .verdict p { margin: 0; color: var(--text-secondary); font-size: 0.875rem; }

  /* The failure state gets the whole page's attention, not a footnote. */
  .bigfail {
    border: 1px solid var(--critical); border-left-width: 4px;
    border-radius: 10px; padding: 18px 20px; margin-bottom: 22px;
    background: var(--surface-1);
  }
  .bigfail h2 {
    color: var(--critical); font-size: 1rem; font-weight: 660;
    margin: 0 0 8px; letter-spacing: -0.01em;
  }
  .bigfail p { margin: 0 0 10px; font-size: 0.875rem; color: var(--text-secondary); }
  .bigfail .why {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 0.75rem; color: var(--text-secondary);
    background: var(--page); border-radius: 6px; padding: 10px 12px;
    word-break: break-word; margin: 0;
  }

  .skipnote {
    border: 1px solid var(--border); border-left: 3px solid var(--baseline);
    border-radius: 0 8px 8px 0; padding: 14px 16px; margin-bottom: 22px;
    background: var(--surface-1); font-size: 0.875rem; color: var(--text-secondary);
  }
  .skipnote b { color: var(--text-primary); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← All recommendations</a>

  <div id="error" hidden></div>
  <main id="main" hidden></main>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const TIER_VAR = {
  update_existing_material: "--tier-1",
  add_new_lesson:           "--tier-2",
  add_optional_content:     "--tier-3",
  investigate_larger_change:"--tier-4",
  watch:                    "--tier-5",
};

// Theme is stored by the dashboard; honour it here so navigating between the
// two pages does not flash a different mode. Guarded: localStorage throws in
// a private window, and the page must render correctly without it.
try {
  const saved = localStorage.getItem("ata-theme");
  if (saved) document.documentElement.dataset.theme = saved;
} catch (_) {}

async function load() {
  const i = new URLSearchParams(location.search).get("i");
  if (i === null || i === "" || isNaN(Number(i))) {
    return showError("No recommendation was named in the link.",
                     "Open this page from a card on the dashboard.");
  }

  let rec;
  try {
    const r = await fetch(`/recommendations/${encodeURIComponent(i)}`);
    if (!r.ok) {
      let detail = r.statusText;
      try { detail = (await r.json()).detail || detail; } catch (_) {}
      throw new Error(detail);
    }
    rec = await r.json();
  } catch (e) {
    return showError("Could not load that recommendation.", e.message);
  }

  render(rec);
}

function showError(headline, detail) {
  const el = $("error");
  el.hidden = false;
  el.className = "err";
  el.innerHTML = `<h2>${esc(headline)}</h2>
    <p style="margin:0;color:var(--text-secondary);font-size:0.875rem">${esc(detail)}</p>`;
}

function render(r) {
  const t = r.trace;
  const c = (t || {}).curriculum || {};
  const v = (t || {}).verification || {};
  const cSteps = c.steps || [];
  const vSteps = v.steps || [];
  const tier = r.recommended_action || "";
  const cvar = TIER_VAR[tier] || "--tier-5";

  document.title = `Agent trace — ${r.trend || "recommendation"}`;

  const head = `
    <div class="heading">
      <div class="grow"><h1 class="title">${esc(r.trend || "untitled")}</h1></div>
      <span class="tag" style="background:var(${cvar});color:var(${cvar}-ink)">${
        esc(tier.replace(/_/g, " ").toUpperCase())}</span>
    </div>
    <div class="facts">
      <span>confidence ${typeof r.confidence === "number" ? r.confidence.toFixed(2) : "n/a"}</span>
      ${r.total_score != null ? `<span class="score"><b>${esc(r.total_score)}</b>/5</span>` : ""}
      ${(r.match || {}).citation ? `<span>📎 <code>${esc(r.match.citation)}</code></span>` : ""}
    </div>`;

  // A snapshot captured before traces existed has nothing to show here. Say
  // that plainly rather than rendering an empty page.
  if (!t) {
    return done(head + `<div class="skipnote">
      <b>No trace was recorded for this recommendation.</b><br>
      It comes from a snapshot captured before agent tracing existed. Re-capture with
      <code>python 02_src/demo_snapshot.py --capture</code> to record one.
    </div>`);
  }

  let body = "";

  if (c.search_failed) {
    body += `<div class="bigfail">
      <h2>⚠ The curriculum search failed</h2>
      <p><b>This is not a finding of "no match".</b> The search did not run to
      completion, so nothing was learned about what the curriculum already covers.
      Any part of this recommendation that reads as "no existing coverage" is
      unsupported — no search produced that conclusion.</p>
      ${c.reason ? `<p class="why">${esc(c.reason)}</p>` : ""}
    </div>`;
  } else if (c.searched === false) {
    body += `<div class="skipnote">
      <b>The curriculum was never searched for this trend.</b><br>
      ${esc(c.skipped_reason || "It did not clear the confidence gate.")}
    </div>`;
  }

  // ---- verification -------------------------------------------------
  // Newer traces carry the verifier's whole loop (`reasoning`, with steps that
  // made no tool call) and which loop ran it (`mode`); older ones only `steps`.
  const vReasoning = v.reasoning || [];
  const vNodes = vReasoning.length ? vReasoning.map((s) => {
      const args = Object.entries(s.tool_args || {})
        .map(([k, val]) => `${esc(k)}=${esc(JSON.stringify(val))}`).join(", ");
      const ask = s.tool ? `Checked <code>${esc(s.tool)}</code>` : esc(s.thought || "");
      const why = s.tool && s.thought
        ? `<div class="args" style="font-family:inherit">Why: ${esc(s.thought)}</div>` : "";
      const empty = /not found|could not|failed/i.test(s.observation || "");
      return node(ask + why, s.observation, args, empty);
    }) : vSteps.map((s) => {
      const args = Object.entries(s.arguments || {})
        .map(([k, val]) => `${esc(k)}=${esc(JSON.stringify(val))}`).join(", ");
      const empty = /^no results/i.test(s.result_summary || "");
      return node(
        `Checked <code>${esc(s.tool || "")}</code>`,
        s.result_summary, args, empty);
    });
  const mode = modeText(v.mode);
  if (mode) body += `<p class="tnote">${esc(mode)}</p>`;
  body += phase("Verification", "Is this trend real?", vNodes.length, vNodes);

  // ---- curriculum ---------------------------------------------------
  body += phase("Curriculum", "Does it affect what we teach?", cSteps.length,
    cSteps.map((s) => {
      const f = Object.entries(s.filters || {})
        .filter(([, val]) => val !== null && val !== undefined && val !== "")
        .map(([k, val]) => `${esc(k)} ${esc(val)}`).join(", ");
      const empty = /^no results/i.test(s.result_summary || "");
      return node(
        `Searched the curriculum for “${esc(s.query || "")}”${
          f ? ` <span style="color:var(--text-muted)">(${f})</span>` : ""}`,
        s.result_summary, "", empty);
    }), c.search_failed
      ? "The search failed before it issued any query."
      : (c.searched === false ? "Skipped — see above." : "No searches were issued."));

  if (v.stopped_early || c.stopped_early) {
    body += `<p class="tnote">An agent hit its step limit and was asked to
             conclude early, so this trace may be shorter than the reasoning was.</p>`;
  }

  if (c.searched && !c.search_failed && c.reason) {
    body += `<div class="verdict"><h2>Conclusion</h2><p>${esc(c.reason)}</p></div>`;
  }

  if ((r.action_plan || []).length) {
    body += `<div class="verdict" style="margin-top:14px">
      <h2>Recommended plan</h2>
      <ul class="plan">${r.action_plan.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>
    </div>`;
  }

  done(head + body);
}

// Plain words for the verifier's mode. Mirrors demo_snapshot.verification_mode_text
// and advanced.html's modeText (a page cannot import Python); keep them in step.
function modeText(mode) {
  const m = String(mode || "").toLowerCase();
  if (!m) return "";
  if (m.includes("llm loop failed")) return "The model call failed, so the same checks ran from a fixed script instead — scored exactly the same way.";
  if (m.startsWith("deterministic")) return "No model was used: the checks ran from a fixed script. The score comes from what the checks found, as always.";
  if (m.startsWith("agentic")) return "The model chose which checks to run. The score was computed from what those checks found, not by the model.";
  return mode;
}

function phase(name, question, count, nodes, emptyText) {
  const inner = nodes.length
    ? `<div class="rail">${nodes.join("")}</div>`
    : `<p class="tnote">${esc(emptyText || "Nothing recorded.")}</p>`;
  return `<section class="phase">
    <div class="phase-head">
      <h2>${esc(name)}</h2><span class="q">${esc(question)}</span>
      <span class="n">${count} step${count === 1 ? "" : "s"}</span>
    </div>
    ${inner}
  </section>`;
}

function node(ask, got, args, empty) {
  return `<div class="node${empty ? " bad" : ""}">
    <div class="ask">${ask}</div>
    ${args ? `<div class="args">${args}</div>` : ""}
    <div class="got"><span class="marker">→</span> ${esc(got || "")}</div>
  </div>`;
}

function done(html) {
  $("main").innerHTML = html;
  $("main").hidden = false;
}

load();
</script>
</body>
</html>
